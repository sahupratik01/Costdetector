services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: costdetective
      POSTGRES_PASSWORD: costdetective
      POSTGRES_DB: costdetective
    ports:
      - "5432:5432"
    volumes:
      - costdetective-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costdetective -d costdetective"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  costdetective-pg:
